name: PR Dry Run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '8.15.4'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  build-site-preview:
    name: Build Site Preview
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '8.15.4'

      - name: Install dependencies
        run: pnpm install

      - name: Build for GitHub Pages (dry run)
        run: |
          GITHUB_PAGES=true pnpm --filter=@littlecarlito/portfolio build

          GITHUB_PAGES=true pnpm --filter=@littlecarlito/3d-portfolio build

          echo "=== Checking build outputs ==="
          ls -la apps/
          echo "Portfolio dist contents:"
          ls -la apps/portfolio/dist/ || echo "Portfolio dist not found"
          echo "3D Portfolio dist contents:"
          ls -la apps/3d_portfolio/dist/ || echo "3D Portfolio dist not found"

          echo "Site build validation successful"
