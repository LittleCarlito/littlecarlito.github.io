name: Main Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-pipeline-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '8.15.4'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  deploy-site:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '8.15.4'

      - name: Install dependencies
        run: pnpm install

      - name: Build for GitHub Pages
        run: |
          GITHUB_PAGES=true pnpm --filter=@littlecarlito/portfolio build

          GITHUB_PAGES=true pnpm --filter=@littlecarlito/3d-portfolio build

          echo "=== Checking build outputs ==="
          ls -la apps/
          echo "Portfolio dist contents:"
          ls -la apps/portfolio/dist/ || echo "Portfolio dist not found"
          echo "3D Portfolio dist contents:"
          ls -la apps/3d_portfolio/dist/ || echo "3D Portfolio dist not found"

          mkdir -p apps/portfolio/dist/3d
          cp -r apps/3d_portfolio/dist/* apps/portfolio/dist/3d/

          echo "Both apps built and combined"

      - name: Add .nojekyll file
        run: touch apps/portfolio/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/portfolio/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
